name: PR title lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only feat: and fix: are allowed; '!' on either marks a breaking change.
          # Reasoning: this is the minimal Conventional Commits subset that maps cleanly
          # to semver (feat → minor, fix → patch, anything with '!' → major).
          types: |
            feat
            fix
            chore
          requireScope: false
