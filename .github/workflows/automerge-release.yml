name: Auto-merge release PR

on:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  automerge:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: policyradar-bot-app-token
        with:
          app-id: ${{ secrets.POLICYRADAR_BOT_APP_ID }}
          private-key: ${{ secrets.POLICYRADAR_BOT_PRIVATE_KEY }}

      - name: Approve (github-actions[bot])
        run: gh pr review "${{ github.event.pull_request.number }}" --approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Enable auto-merge (policyradar[bot])
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --rebase
        env:
          GITHUB_TOKEN: ${{ steps.policyradar-bot-app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
