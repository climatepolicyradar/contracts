version: 2
models:
  - name: document_v1
    description: Canonical Document
    columns:
      - name: id
        data_type: STRING
        data_tests:
          - not_null
      - name: title
        data_type: STRING
        data_tests:
          - not_null
      - name: description
        data_type: STRING
      - name: items
        data_type: ARRAY
      - name: attributes
        data_type: OBJECT
      - name: labels
        data_type: ARRAY
        data_tests:
          - not_null
      - name: documents
        data_type: ARRAY
        data_tests:
          - not_null
